version: '3.8'

services:
  discord-bot:
    build: .
    container_name: discord_bot
    env_file:
      - .env
    volumes:
      # Mount for live development (optional - remove for production)
      - ./bot.py:/app/bot.py
      - ./assets:/app/assets
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"